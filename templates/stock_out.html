{% extends "base.html" %}
{% block content %}

<h1>Stock Out</h1>

<section class="panel">
    <h2>Release Stock</h2>

    <form method="POST" class="form-grid">
        <select name="item_id" id="itemSelect" required onchange="fillItemDetails()">
            <option value="">Select Item</option>
            {% for item in items %}
            <option
                value="{{ item.id }}"
                data-category="{{ item.category or '' }}"
                data-unit="{{ item.unit or '' }}"
                data-quantity="{{ item.quantity or 0 }}"
                data-branch="{{ item.branch or '' }}"
                data-supplier="{{ item.supplier_name or 'N/A' }}">
                {{ item.item_name }}
            </option>
            {% endfor %}
        </select>

        <input id="categoryBox" placeholder="Category" readonly>
        <input id="unitBox" placeholder="Unit" readonly>
        <input id="currentStockBox" placeholder="Current Stock" readonly>
        <input id="branchBox" placeholder="Branch" readonly>
        <input id="supplierBox" placeholder="Supplier" readonly>

        <select name="employee_id" required>
            <option value="">Assign / Given To Employee</option>
            {% for e in employees %}
            <option value="{{ e.id }}">
                {{ e.employee_name }}{% if e.branch %} - {{ e.branch }}{% endif %}
            </option>
            {% endfor %}
        </select>

        <input name="quantity" type="number" placeholder="Quantity to Release" min="1" required>

        <textarea name="remarks" placeholder="Purpose / Remarks"></textarea>

        <button type="submit">Save Stock Out</button>
    </form>
</section>

<script>
function fillItemDetails() {
    const select = document.getElementById("itemSelect");
    const option = select.options[select.selectedIndex];

    document.getElementById("categoryBox").value = option.getAttribute("data-category") || "";
    document.getElementById("unitBox").value = option.getAttribute("data-unit") || "";
    document.getElementById("currentStockBox").value = option.getAttribute("data-quantity") || "";
    document.getElementById("branchBox").value = option.getAttribute("data-branch") || "";
    document.getElementById("supplierBox").value = option.getAttribute("data-supplier") || "";
}
</script>

{% endblock %}
