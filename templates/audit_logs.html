{% extends "base.html" %}
{% block content %}
<h1>Audit Logs</h1>

<section class="panel">
    <h2>Recent System Activities</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>User</th>
                <th>Action</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
        {% for log in logs %}
            <tr>
                <td>{{ log.date_created }}</td>
                <td>{{ log.user_name }}</td>
                <td><span class="badge">{{ log.action }}</span></td>
                <td>{{ log.details }}</td>
            </tr>
        {% else %}
            <tr><td colspan="4">No audit logs yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
